version: 2

project_name: specutil

before:
  hooks:
    - go mod tidy

builds:
  - id: specutil
    main: ./cmd/specutil
    binary: specutil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: specutil
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: roshbhatia
    name: specutil
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore(deps)"
      - "^chore: regenerate"

