version: 2

project_name: specutil

before:
  hooks:
    - go run ./cmd/specutil generate --check

builds:
  - id: specutil
    main: ./cmd/specutil
    binary: specutil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: specutil
    ids: [specutil]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: roshbhatia
    name: specutil
  draft: false
  prerelease: auto

changelog:
  use: github-native

homebrew_casks:
  - name: specutil
    ids: [specutil]
    binaries: [specutil]
    homepage: https://github.com/roshbhatia/specutil
    description: Project OpenSpec changes into review-ready outputs
    license: MIT
    completions:
      bash: completions/specutil.bash
      zsh: completions/specutil.zsh
      fish: completions/specutil.fish
    hooks:
      post:
        install: |
          system_command "/bin/mkdir", args: ["-p", "#{HOMEBREW_PREFIX}/share/nushell/vendor/autoload"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/specutil.nu", "#{HOMEBREW_PREFIX}/share/nushell/vendor/autoload/specutil.nu"]
        uninstall: |
          system_command "/bin/rm", args: ["-f", "#{HOMEBREW_PREFIX}/share/nushell/vendor/autoload/specutil.nu"]
    repository:
      owner: roshbhatia
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
