version: 2

project_name: specutil

before:
  hooks:
    - go run ./cmd/specutil generate --check

builds:
  - id: specutil
    main: ./cmd/specutil
    binary: specutil
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: specutil
    ids: [specutil]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: roshbhatia
    name: specutil
  draft: false
  prerelease: auto

changelog:
  use: github-native
