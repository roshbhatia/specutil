name: Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "skills/**"
      - ".github/CONTRIBUTING.md"
      - "internal/cli/**"
      - "examples/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

jobs:
  update-wiki:
    name: Regenerate wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check wiki exists
        id: wiki-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" HEAD 2>/dev/null | grep -q HEAD; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Wiki not initialized — go to https://github.com/${{ github.repository }}/wiki and create the first page to enable auto-generation."
          fi

      - name: Build specutil
        if: steps.wiki-check.outputs.exists == 'true'
        run: go build -o specutil-bin ./cmd/specutil

      - name: Checkout wiki
        if: steps.wiki-check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wiki pages
        if: steps.wiki-check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          BIN="./specutil-bin"

          # Home — project overview extracted from README up to first ## section
          # Replace relative asset paths with raw GitHub URLs so the wiki can render them
          awk '/^## /{found=1} !found{print}' README.md \
            | sed 's|src="assets/|src="https://raw.githubusercontent.com/${{ github.repository }}/main/assets/|g' \
            > wiki/Home.md
          printf '\n---\n> This wiki is auto-generated. Edit source files in the repo, not here.\n\n**Pages**\n- [[Installation]]\n- [[Providers]]\n- [[CLI-Reference]]\n- [[Examples]]\n- [[Skills]]\n- [[Contributing]]\n' >> wiki/Home.md

          # Installation
          awk '/^## Installation/,/^## [^I]/' README.md | head -n -1 > wiki/Installation.md

          # Providers
          {
            echo "# Providers"
            echo ""
            awk '/^## Quickstart/,/^## Commands/' README.md | head -n -1
          } > wiki/Providers.md

          # CLI Reference — generated from binary --help output
          {
            echo "# CLI Reference"
            echo ""
            echo "> Auto-generated from \`specutil --help\`. Always reflects the current binary."
            echo ""
            echo "## specutil"
            echo '```'
            "$BIN" --help 2>&1 || true
            echo '```'
            echo ""
            for verb in render plan diff lock graph tui web; do
              echo "## specutil $verb"
              echo '```'
              "$BIN" "$verb" --help 2>&1 || true
              echo '```'
              echo ""
            done
            echo "## specutil lock get / set"
            echo '```'
            "$BIN" lock get --help 2>&1 || true
            echo ""
            "$BIN" lock set --help 2>&1 || true
            echo '```'
          } > wiki/"CLI-Reference.md"

          # Examples — collate all examples/*/README.md
          # Demote H1 and H2 from embedded READMEs to avoid collisions with wiki structure
          {
            echo "# Examples"
            echo ""
            echo "Working examples live in the [\`examples/\`](https://github.com/${{ github.repository }}/tree/main/examples) directory."
            echo ""
            for example_dir in examples/*/; do
              echo "## $(basename "$example_dir")"
              echo ""
              if [ -f "$example_dir/README.md" ]; then
                sed 's/^# /### /; s/^## /#### /' "$example_dir/README.md"
              fi
              echo ""
            done
          } > wiki/Examples.md

          # Skills — show human-readable description only (skip YAML frontmatter)
          {
            echo "# Skills"
            echo ""
            echo "Skills drive remote writes — the binary produces a plan; a skill applies it."
            echo "Install skills via your AI coding assistant (Claude Code, Cursor, etc.)."
            echo ""
            for skill_dir in skills/*/; do
              skill_name="$(basename "$skill_dir")"
              echo "## $skill_name"
              echo ""
              if [ -f "$skill_dir/SKILL.md" ]; then
                # Extract description from frontmatter and body content after the closing ---
                desc=$(awk '/^description:/{sub(/^description: */,""); print; exit}' "$skill_dir/SKILL.md")
                [ -n "$desc" ] && echo "$desc" && echo ""
                # Print body content after the second --- (end of frontmatter)
                awk 'BEGIN{n=0} /^---/{n++; next} n>=2{print}' "$skill_dir/SKILL.md" | head -40
              fi
              echo ""
            done
          } > wiki/Skills.md

          cp .github/CONTRIBUTING.md wiki/Contributing.md

      - name: Commit wiki changes
        if: steps.wiki-check.outputs.exists == 'true'
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes"
          else
            git commit -m "chore: regenerate wiki from ${{ github.sha }}"
            git push
          fi
