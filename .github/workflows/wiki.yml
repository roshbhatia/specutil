name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "skills/**"
      - ".github/CONTRIBUTING.md"
      - "internal/cli/root.go"

permissions:
  contents: write

jobs:
  update-wiki:
    name: Regenerate wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wiki pages
        run: |
          set -euo pipefail

          # Home — project overview extracted from README up to first ## section
          awk '/^## /{found=1} !found{print}' README.md > wiki/Home.md
          cat >> wiki/Home.md << 'EOF'

          ---
          > This wiki is auto-generated from the repository. Edit source files in the repo, not here.

          **Pages**
          - [[Installation]]
          - [[Providers]]
          - [[CLI Reference]]
          - [[Skills]]
          - [[Contributing]]
          EOF

          # Installation
          awk '/^## Installation/,/^## [^I]/' README.md | head -n -1 > wiki/Installation.md

          # Providers
          {
            echo "# Providers"
            echo ""
            awk '/^## Quickstart/,/^## Commands/' README.md | head -n -1
          } > wiki/Providers.md

          # CLI Reference
          {
            echo "# CLI Reference"
            echo ""
            awk '/^## Commands/,/^## OpenSpec Integration/' README.md | head -n -1
          } > wiki/"CLI-Reference.md"

          # Skills
          {
            echo "# Skills"
            echo ""
            echo "Skills drive remote writes — the binary produces a plan; a skill applies it."
            echo ""
            for skill_dir in skills/*/; do
              skill_name=$(basename "$skill_dir")
              echo "## $skill_name"
              echo ""
              if [ -f "$skill_dir/SKILL.md" ]; then
                head -60 "$skill_dir/SKILL.md"
              fi
              echo ""
            done
          } > wiki/Skills.md

          # Contributing
          cp .github/CONTRIBUTING.md wiki/Contributing.md

      - name: Commit wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes"
          else
            git commit -m "chore: regenerate wiki from ${{ github.sha }}"
            git push
          fi
